name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate JSON / YAML / shell / node / python / SKILL.md frontmatter
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "JSON FAIL: $f"; fail=1; }
          done < <(find . -name '*.json' -not -path '*/node_modules/*' -not -path '*/.git/*')
          while IFS= read -r f; do
            node --check "$f" || { echo "NODE FAIL: $f"; fail=1; }
          done < <(find . -name '*.cjs' -not -path '*/node_modules/*' -not -path '*/.git/*')
          while IFS= read -r f; do
            bash -n "$f" || { echo "BASH FAIL: $f"; fail=1; }
          done < <(find . -name '*.sh' -not -path '*/.git/*')
          while IFS= read -r f; do
            python3 -m py_compile "$f" || { echo "PY FAIL: $f"; fail=1; }
          done < <(find . -name '*.py' -not -path '*/.git/*')
          while IFS= read -r f; do
            python3 -c "import yaml; yaml.safe_load(open('$f'))" || { echo "YAML FAIL: $f"; fail=1; }
          done < <(find . \( -name '*.yaml' -o -name '*.yml' \) -not -path '*/.git/*')
          while IFS= read -r f; do
            python3 - <<PY || { echo "FRONTMATTER FAIL: $f"; fail=1; }
          import re
          t=open('$f').read()
          m=re.match(r'^---\s*\n(.*?)\n---',t,re.S)
          assert m, 'no frontmatter'
          fm=m.group(1)
          assert re.search(r'^\s*name\s*:',fm,re.M), 'missing name'
          assert re.search(r'^\s*description\s*:',fm,re.M), 'missing description'
          PY
          done < <(find . -name 'SKILL.md')
          exit $fail
